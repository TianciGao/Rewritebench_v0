case_id: PORT_0008
pool: PORT
status: canonical_layout_full_case_migration_preview_only
source_family: PARROT
source_id: SRC_009
source_subset: BIRD
source_entry_pointer: datasets/raw/parrot/PARROT/benchmark/BIRD/pg_res.json[4]
source_dialect: postgres_like_candidate
benchmark_scope:
