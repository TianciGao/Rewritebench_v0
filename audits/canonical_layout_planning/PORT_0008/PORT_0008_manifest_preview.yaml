    ddl: schema/postgres/ddl.sql
    load: schema/postgres/load.sql
  mysql:
    ddl: schema/mysql/ddl.sql
    load: schema/mysql/load.sql
  spark:
    ddl: schema/spark/ddl.sql
    load: schema/spark/load.sql
