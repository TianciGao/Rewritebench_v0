        suggested_approval_wording: "Approve neg_01 because rewrite_neg_01 groups PostHistory rows by editor as well as post. This fragments the intended per-post revision aggregation, changes revision counts and first/last revision timestamps, and can alter the threshold filter. Therefore neg_01 is an intentional hard negative and should be rejected by the checker."
