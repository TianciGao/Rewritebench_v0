          - cases/LONGTAIL/LONGTAIL_0024/runs/mysql/result_check.json
          - cases/LONGTAIL/LONGTAIL_0024/runs/spark/result_check.json
          - cases/LONGTAIL/LONGTAIL_0024/runs/pg/rewrite_neg_01.tsv
          - cases/LONGTAIL/LONGTAIL_0024/runs/mysql/rewrite_neg_01.tsv
          - cases/LONGTAIL/LONGTAIL_0024/runs/spark/rewrite_neg_01.tsv
