[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-rewrite-bench"
version = "0.1.0"
description = "SQL-RewriteBench public workbench utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sqlrb = "cli.main:main"

[project.optional-dependencies]
sqlglot = ["sqlglot"]

[tool.setuptools.packages.find]
where = ["src"]
